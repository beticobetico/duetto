<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0d17">
<meta name="description" content="Tú pones la letra, alguien pone la música. Compón en pareja con creadores de todo el mundo, recibe críticas útiles y firma acuerdos de coautoría registrados.">
<meta property="og:title" content="Duetto — Tú pones la letra. Alguien pone la música.">
<meta property="og:description" content="Sube tu letra, tu música o tu canción terminada. Otros compositores le ponen su voz, su melodía o su opinión.">
<meta property="og:image" content="https://duettosongs.com/icon-512.png">
<meta property="og:url" content="https://duettosongs.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>Duetto — lyrics meet music</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script type="module" src="wallet.js?v=21"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d17; --card:#1a1726; --card2:#221e31; --line:#2e2943;
  --text:#f2eff9; --muted:#a39cb8; --accent:#ff6b8b; --accent2:#ffb36b;
  --lyr:#8b7bff; --mus:#3fd0b4; --ok:#5fd38d; --warn:#ffcf5c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{resize:vertical;min-height:120px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--lyr);border-color:transparent}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:rgba(15,13,23,.92);backdrop-filter:blur(10px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:"DM Serif Display",serif;font-size:26px;letter-spacing:.3px}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.userchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#140f1f;flex:none}
.lang{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;padding:9px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.tab.on.l{background:rgba(139,123,255,.16);border-color:var(--lyr);color:var(--text)}
.tab.on.m{background:rgba(63,208,180,.14);border-color:var(--mus);color:var(--text)}
.tab.on.a{background:rgba(255,107,139,.14);border-color:var(--accent);color:var(--text)}
main{padding:14px 16px}
.demo{font-size:12px;color:var(--warn);background:rgba(255,207,92,.08);border:1px dashed rgba(255,207,92,.4);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.challenge{background:linear-gradient(135deg,#3a1f4f,#5a2440 60%,#6b3a22);border-radius:18px;padding:16px;margin-bottom:14px}
.challenge small{text-transform:uppercase;letter-spacing:1px;font-size:11px;opacity:.8;font-weight:600}
.challenge h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:21px;margin:4px 0}
.challenge p{font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card.click{cursor:pointer;transition:border-color .15s}
.card.click:hover{border-color:#4a4366}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;text-transform:uppercase;letter-spacing:.5px}
.badge.l{background:rgba(139,123,255,.18);color:#b9afff}
.badge.m{background:rgba(63,208,180,.16);color:#7fe6d2}
.badge.c{background:rgba(95,211,141,.16);color:var(--ok)}
.badge.o{background:rgba(255,179,107,.15);color:var(--accent2)}
.ptitle{font-family:"DM Serif Display",serif;font-size:21px;margin:8px 0 2px;font-weight:400}
.meta{font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.lyrics{white-space:pre-wrap;font-family:"DM Serif Display",serif;font-size:17px;line-height:1.55;color:#e6e0f5;background:var(--card2);border-radius:12px;padding:12px 14px;margin-top:10px}
.locked{position:relative;overflow:hidden;max-height:92px}
.locked:after{content:"";position:absolute;inset:auto 0 0 0;height:60px;background:linear-gradient(transparent,var(--card2))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px}
.btn.pri{background:linear-gradient(90deg,var(--accent),#ff8a6b);color:#1a0d12}
.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn.ghost{color:var(--muted);padding:8px 10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
audio{width:100%;margin-top:10px;height:40px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.back{color:var(--muted);font-size:14px;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.sect{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:18px 0 10px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.split div:first-child{background:var(--lyr)}.split div:last-child{background:var(--mus)}
.prop{background:var(--card2);border-radius:14px;padding:12px;margin-top:10px;border:1px solid transparent}
.prop.chosen{border-color:var(--ok)}
.stars{display:flex;gap:2px}
.star{font-size:18px;color:#4a4366;padding:0 1px}
.star.on{color:var(--warn)}
.rate{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:13px;margin-top:8px}
.comment{font-size:13px;border-top:1px solid var(--line);padding-top:7px;margin-top:7px}
.comment b{font-weight:600}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tp{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.tp b{display:block;font-size:15px;margin-bottom:3px}
.tp span{font-size:12.5px;color:var(--muted)}
.tp.on.l{border-color:var(--lyr);background:rgba(139,123,255,.1)}
.tp.on.m{border-color:var(--mus);background:rgba(63,208,180,.08)}
.range{display:flex;align-items:center;gap:10px}
.range input{padding:0;accent-color:var(--accent)}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);word-break:break-all;background:#120f1c;border-radius:8px;padding:7px 9px;margin-top:4px}
.agree{border:1.5px solid var(--ok);background:rgba(95,211,141,.05)}
.sig{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ok{color:var(--ok);font-weight:600;font-size:13px}
.pend{color:var(--warn);font-weight:600;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,17,31,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:6}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;padding:10px 0 12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--text)}
nav svg{width:22px;height:22px}
nav .plus{background:linear-gradient(135deg,var(--accent),var(--accent2));width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#1a0d12;margin-top:-4px}
.overlay{position:fixed;inset:0;background:rgba(5,4,10,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px 26px;max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
.sheet h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:22px;margin-bottom:8px}
.sheet p{color:var(--muted);font-size:14px;margin-bottom:8px}
.rules li{font-size:14px;margin:0 0 8px 18px;color:#dcd6ea}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2b2540;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw}
.userlist button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;text-align:left}
.userlist button:hover,.userlist button.on{background:var(--card2)}
.file{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;position:relative}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.anch{margin-top:10px;font-size:13.5px;color:var(--ok);font-weight:600}.anch a,.sig a{color:inherit}
a.btn{text-decoration:none;color:var(--text)}
.studio{background:#15121f;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.kara{white-space:pre-wrap;font-family:"DM Serif Display",serif;font-size:16px;line-height:1.5;max-height:170px;overflow:auto;background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px}
.prog{height:6px;background:var(--card2);border-radius:9px;margin-top:12px;overflow:hidden}.prog div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btn.rec{background:#3a1622;border:1px solid #6b2a3c;color:#ffd0da}.btn.rec.live{background:#e0405f;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.nomic{font-size:13px;color:var(--warn);background:rgba(255,207,92,.08);border-radius:10px;padding:9px 10px;margin-top:10px}
input[type=range]{padding:0;accent-color:var(--accent)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.filters input{grid-column:1/-1}
.filters input,.filters select{padding:8px 10px;font-size:13px;border-radius:10px}
.filters select{width:100%}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}.iconbtn:hover{background:var(--card2)}.iconbtn svg{width:18px;height:18px}
.bell{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.bell svg{width:19px;height:19px}.bell i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#1a0d12;font-size:10.5px;font-style:normal;font-weight:800;display:none;place-items:center;padding:0 4px}
.av.img{background-size:cover!important;background-position:center;color:transparent}
.card.boost{border-color:rgba(255,179,107,.55);box-shadow:0 0 0 1px rgba(255,179,107,.2) inset}
.hiddenmsg{font-size:12.5px;color:var(--warn);background:rgba(255,207,92,.08);border-radius:8px;padding:6px 9px;margin-top:8px}
.click{cursor:pointer}
.checkrow{color:var(--text)!important;font-size:14px!important;flex-wrap:nowrap;gap:8px;margin-top:10px!important}.checkrow input{width:auto}
.chip{display:inline-flex!important;align-items:center;gap:5px;margin:0!important;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--text)!important;font-size:13px!important}.chip input{width:auto}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.statgrid div{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.statgrid b{display:block;font-size:16px}.statgrid span{font-size:11px;color:var(--muted)}
.notif.unread{border-color:var(--accent)}
.chatbox{height:46vh;overflow:auto;background:#15121f;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;background:var(--card2);border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;align-self:flex-start}
.msg.mine{align-self:flex-end;background:rgba(255,107,139,.18);border-radius:14px 14px 4px 14px}.msg span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.qr{background:#fff;border-radius:14px;padding:12px;width:max-content;margin:8px auto}.qr img,.qr canvas{display:block}
.challenge.click{cursor:pointer}

.tab{font-size:12.5px!important;padding:9px 12px!important;flex:1 0 auto!important;white-space:nowrap}
#tabs>.row{overflow-x:auto;scrollbar-width:none;padding-bottom:2px}#tabs>.row::-webkit-scrollbar{display:none}
.tab.on.s{background:rgba(255,179,107,.14);border-color:var(--accent2);color:var(--text)}
.badge.s{background:rgba(255,179,107,.16);color:#ffc890}
.tp.wide{grid-column:1/-1}.tp.on.s{border-color:var(--accent2);background:rgba(255,179,107,.08)}
.minwave{display:flex;align-items:center;gap:2px;height:38px;margin-top:10px}.minwave i{flex:1;background:linear-gradient(#ffb36b,#ff6b8b);border-radius:2px;opacity:.75}
.player{margin-top:12px;background:var(--card2);border-radius:14px;padding:12px}
.wave{position:relative;height:84px;cursor:pointer}
.wbars{position:absolute;inset:14px 0 0 0;display:flex;align-items:center;gap:2px}.wbars i{flex:1;background:#4a4366;border-radius:2px}
.wprog{position:absolute;left:0;top:14px;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,107,139,.35),rgba(255,179,107,.35));border-right:2px solid var(--accent);pointer-events:none;border-radius:4px 0 0 4px}
.wmarks{position:absolute;left:0;right:0;top:0;height:14px}
.wdot{position:absolute;top:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--warn);border:2px solid var(--card2);padding:0}
.markrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:6px;font-size:14px}
.mtime{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:rgba(255,207,92,.15);color:var(--warn);border-radius:8px;padding:3px 7px;flex:none}
.catbar{display:grid;grid-template-columns:118px 1fr 30px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}.catbar span{color:var(--muted)}
.catbar div{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}.catbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.retchart{width:100%;height:auto;display:block}.retchart .grid{stroke:#3a3452;stroke-dasharray:4 4}.retchart text{fill:#a39cb8;font-size:10px;font-family:Inter,sans-serif}
.rvchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rvchips span{font-size:12px;background:#15121f;border-radius:999px;padding:4px 9px;color:var(--muted)}.rvchips b{color:var(--warn);font-weight:400;letter-spacing:1px}
details summary{list-style:none}

#welcome{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 60% at 50% 0%,rgba(255,107,139,.18),transparent 60%),var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.wwrap{max-width:560px;margin:0 auto;padding:18px 18px 40px}
.whero{font-family:"DM Serif Display",serif;font-weight:400;font-size:38px;line-height:1.1;margin:34px 0 12px;background:linear-gradient(90deg,var(--text),#ffd2dc);-webkit-background-clip:text;background-clip:text;color:transparent}
.wsub{color:var(--muted);font-size:16px;margin-bottom:22px}
.btn.big{padding:15px;font-size:16px;font-weight:700}
.wlang{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted)}
.wsteps{display:grid;gap:10px}
.wstep{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wnum{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,107,139,.25),rgba(255,179,107,.25));font-size:18px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.wcard b{display:block;margin:6px 0 4px;font-size:14px}.wcard p{color:var(--muted);font-size:13px;line-height:1.35}
.wico{font-size:22px}
.wfoot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}

.wa{margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.wa .wah{color:var(--muted);font-size:12px;margin:8px 0 5px}
.wachips{display:flex;flex-wrap:wrap;gap:6px}
.wachips button{background:rgba(139,123,255,.16);border:1px solid rgba(139,123,255,.35);border-radius:999px;padding:4px 10px;font-size:13px}
.wachips.soft button{background:transparent;border-color:var(--line);color:var(--muted)}
.wa details{margin-top:8px}.wa summary{cursor:pointer;color:var(--muted);font-size:12px}
.walines{margin-top:6px;max-height:220px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px}
.walines div{display:flex;gap:8px;padding:1px 0;color:var(--muted)}.walines div.on{color:var(--text)}
.walines span{min-width:22px;text-align:right;color:var(--lyr);font-weight:700}.walines .gap{height:8px}
.obgrid{display:grid;gap:8px;margin-top:12px}.obgrid .tp{text-align:left}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="logo"><span>Duetto</span></div>
      <div class="row">
        <button class="bell" id="bellBtn" aria-label="Avisos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><i id="bellN"></i></button>
        <button class="lang" id="langBtn">EN</button>
        <button class="userchip" id="userBtn"></button>
      </div>
    </div>
    <div id="tabs" style="margin-top:12px"></div>
  </header>
  <main id="main"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="modal"></div>

<script src="app.js?v=21"></script>
